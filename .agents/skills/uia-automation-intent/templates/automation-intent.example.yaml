schema_version: "1.0"

# Regression example for TC_PD_001. The password is intentionally not present.
intent:
  id: "AI-PRODUCT-DETAIL-001"
  lifecycle:
    stage: PRE_RUNTIME
    status: READY_FOR_MATCHING
  case:
    id: "TC_PD_001"
    name: "带目录的自定义URL在密码保护下可通过验证并正常展示内容"
    module: "产品详情"
    source_refs:
      - type: TEST_CASE
        ref: "TC_PD_001"
    priority: P0
  eligibility:
    status: ELIGIBLE
    reasons:
      - "后台配置和前台密码保护结果均可通过用户可见 UI 验证"
    excluded_points: []
  goal:
    actor:
      semantic_name: "产品管理员与访问者"
    action:
      semantic_name: "配置并访问"
    object:
      semantic_name: "带目录的产品详情页"
    expected_business_result:
      - "未验证密码时显示密码输入页且不显示产品内容"
      - "输入正确密码验证后显示产品内容"
  test_data:
    variables:
      - id: target_product
        semantic_name: "目标产品"
        type: STRING
        required: true
        value: null
        source:
          type: TEST_CASE
          ref: "TC_PD_001"
          description: "测试用例要求准备目标产品"
        sensitivity: NORMAL
      - id: custom_product_path
        semantic_name: "产品自定义URL"
        type: STRING
        required: true
        value: "/bug1004949/product.html"
        source:
          type: TEST_CASE
          ref: "TC_PD_001"
          description: "测试用例提供带目录的自定义URL"
        sensitivity: NORMAL
      - id: page_access_password
        semantic_name: "页面权限密码"
        type: STRING
        required: true
        value: null
        source:
          type: TEST_CASE
          ref: "TC_PD_001"
          description: "测试用例提供页面权限密码；具体值通过安全测试数据注入"
        sensitivity: SECRET
  preconditions:
    - id: PRE-01
      statement: "已准备目标产品"
      knowledge_level: CONFIRMED
      source_refs:
        - type: TEST_CASE
          ref: "TC_PD_001"
    - id: PRE-02
      statement: "已准备页面权限密码"
      knowledge_level: CONFIRMED
      source_refs:
        - type: TEST_CASE
          ref: "TC_PD_001"
    - id: PRE-03
      statement: "已准备新的前台浏览器无痕窗口，且未登录并未完成密码验证"
      knowledge_level: CONFIRMED
      source_refs:
        - type: TEST_CASE
          ref: "TC_PD_001"
  ui_context:
    entry:
      semantic_path: ["产品", "产品管理", "目标产品编辑", "页面设置", "基础设置"]
      knowledge_refs: [page-prod, component-module-navigation]
    target_page:
      semantic_name: "后台产品管理页"
      knowledge_ref: page-prod
      resolution_status: RESOLVED
    target_region:
      semantic_name: "产品列表与工具区"
      knowledge_ref: prod-management
      resolution_status: RESOLVED
    related_components:
      - semantic_name: "产品模块导航"
        knowledge_ref: component-module-navigation
        role: UI_SURFACE
      - semantic_name: "产品URL编辑器"
        knowledge_ref: component-product-url-editor
        role: UI_SURFACE
      - semantic_name: "密码访问控件"
        knowledge_ref: component-password-access-control
        role: UI_SURFACE
      - semantic_name: "密码输入页"
        knowledge_ref: component-password-gate
        role: UI_SURFACE
  steps:
    - id: S1
      intent: "进入产品管理并打开目标产品编辑页"
