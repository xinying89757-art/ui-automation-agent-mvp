schema_version: uia-config.v1
# For ordinary use, prefer: python3 scripts/uia.py setup --profile NAME --environment p --site DOMAIN
# This file shows manual per-profile overrides; all paths are relative to its location.
environment:
  id: p # p | gray | production
  # entry_url: http://jianzhan.leadong.com/website.html
  # login_url: http://jianzhan.leadong.com/login.html
  # cloud_url: http://jianzhan.leadong.com/website.html
site: https://test.example.invalid
# Network defaults come from the selected environment. An optional local override:
# network: {mode: pac, pac_file: ../assets/playwright-runner/network/gray.pac}
auth:
  provider: leadong
  credentials_file: ../.auth/credentials/operator.local.json
  storage_state: ../.auth/sessions/operator.json
  secret_env: []
source_roots: []
data_rules: {}
execution:
  batch_size: 10
  workers: 1
  stability_passes: 2 # 每日交付改为 1；夜间回归保持 2
  repair_rounds: 2
  exploration_minutes_per_flow: 10
  strategies_per_gap: 2
  timeout_ms: 180000
mutation:
  allowed: false
  scope: []
