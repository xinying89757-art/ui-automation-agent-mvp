      required_capability_refs: [CAP-04]
      runtime_unknown_refs: [RU-03]
      source_refs: [{type: TEST_CASE, ref: "TC_PD_001"}]
    - id: S4
      intent: "配置密码访问并保存页面权限"
      context:
        page: {semantic_name: "后台产品管理页", knowledge_ref: page-prod}
        region: {semantic_name: "访问权限", knowledge_ref: null}
      anchor:
        primary: {semantic_name: "访问权限"}
        secondary: []
      target:
        semantic_name: "密码访问控件"
        expected_type: FORM_CONTROL_GROUP
        knowledge_ref: component-password-access-control
      action: {type: SAVE, value_ref: "${page_access_password}"}
      expected_transition:
        - {type: CONFIGURATION_SAVED, semantic_target: "页面密码访问"}
      required_capability_refs: [CAP-05]
      runtime_unknown_refs: [RU-04]
      source_refs: [{type: TEST_CASE, ref: "TC_PD_001"}]
    - id: S5
      intent: "在无痕未登录窗口打开产品详情的带目录自定义URL"
      context:
        page: {semantic_name: "前台产品详情页", knowledge_ref: null}
        region: {semantic_name: "产品访问入口", knowledge_ref: null}
      anchor:
        primary: {semantic_name: "产品自定义URL", value_ref: "${custom_product_path}"}
        secondary: []
      target:
        semantic_name: "产品详情访问地址"
        expected_type: URL_ENTRY
        knowledge_ref: null
      action: {type: OPEN, value_ref: "${custom_product_path}"}
      expected_transition:
        - {type: PAGE_OR_REGION_VISIBLE, semantic_target: "密码输入页"}
      required_capability_refs: [CAP-06]
      runtime_unknown_refs: [RU-05]
      source_refs: [{type: TEST_CASE, ref: "TC_PD_001"}]
    - id: S6
      intent: "在密码输入页提交正确密码"
      context:
        page: {semantic_name: "前台产品详情页", knowledge_ref: null}
        region: {semantic_name: "密码验证区域", knowledge_ref: null}
      anchor:
        primary: {semantic_name: "页面权限密码"}
        secondary: []
      target:
        semantic_name: "密码输入与提交控件"
        expected_type: FORM_CONTROL_GROUP
        knowledge_ref: component-password-gate
      action: {type: SUBMIT, value_ref: "${page_access_password}"}
      expected_transition:
        - {type: CONTENT_ACCESS_GRANTED, semantic_target: "产品内容"}
      required_capability_refs: [CAP-08]
      runtime_unknown_refs: [RU-06]
      source_refs: [{type: TEST_CASE, ref: "TC_PD_001"}]
    - id: S7
      intent: "确认未验证时显示密码输入页且不显示产品内容"
      context:
        page: {semantic_name: "前台产品详情页", knowledge_ref: null}
        region: {semantic_name: "密码访问状态", knowledge_ref: null}
      anchor:
        primary: {semantic_name: "密码输入页"}
        secondary: []
      target:
        semantic_name: "密码输入页"
        expected_type: PAGE_OR_REGION
        knowledge_ref: component-password-gate
      action: {type: ASSERT, value_ref: null}
      expected_transition:
        - {type: BUSINESS_RESULT_VISIBLE, semantic_target: "密码输入页可见且产品内容不可见"}
      required_capability_refs: [CAP-07]
      runtime_unknown_refs: []
      source_refs: [{type: TEST_CASE, ref: "TC_PD_001"}]
    - id: S8
      intent: "确认正确密码验证后显示产品内容"
      context:
        page: {semantic_name: "前台产品详情页", knowledge_ref: null}
        region: {semantic_name: "产品内容", knowledge_ref: null}
      anchor:
        primary: {semantic_name: "产品内容"}
        secondary: []
      target:
        semantic_name: "产品详情内容"
        expected_type: CONTENT_REGION
        knowledge_ref: null
      action: {type: ASSERT, value_ref: null}
      expected_transition:
        - {type: BUSINESS_RESULT_VISIBLE, semantic_target: "产品内容可见"}
      required_capability_refs: [CAP-09]
      runtime_unknown_refs: [RU-06]
      source_refs: [{type: TEST_CASE, ref: "TC_PD_001"}]
  required_capabilities:
