      - {id: K-02, fact: "页面访问权限使用密码保护", source_refs: [{type: TEST_CASE, ref: "TC_PD_001"}]}
      - {id: K-03, fact: "正确密码验证后应显示产品内容", source_refs: [{type: TEST_CASE, ref: "TC_PD_001"}]}
