schema_version: case-spec.v1
case_id: TC-0004
intent: 从设置面板打开管理txt文件并显示默认页签
automatable: {status: 'yes', reason: 可通过编辑器操作验证}
required_env: []
data_prep: {}
mutation_scope: []
start_page: editor
steps:
- {id: S1, verb: open, target: settings}
- {id: S2, verb: click, target: txt.entry}
- {id: S3, verb: assert, target: txt.dialog}
assertions:
- id: A1
  after: S1
  excel: 1. 网站设置面板显示“管理txt文件”。
  checks:
  - {target: txt.entry, op: contains, value: 管理txt文件}
- id: A2
  after: S2
  excel: 2. 页面打开标题为“管理txt文件”的弹窗。
  checks:
  - {target: txt.title, op: text, value: 管理txt文件}
  - {target: txt.dialog, op: visible}
- id: A3
  after: S3
  excel: 3. 默认选中“llms.txt”页签，左侧显示“取消”，右侧显示“保存”。
  checks:
  - {target: txt.tab.llms, op: text, value: llms.txt}
  - {target: txt.cancel, op: text, value: 取消}
  - {target: txt.save, op: text, value: 保存}
  - {target: txt.cancel, op: left_of, value: txt.save}
questions: []
