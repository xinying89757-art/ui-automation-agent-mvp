<body>
<header class="top"><div class="top-inner">
  <div class="brand"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5h10v15H6V5h2m1-2h6v4H9z"/><path d="m9 13 2 2 4-4"/></svg></span>提测审阅</div>
  <div class="top-actions"><span id="saveStatus" class="small muted save-indicator" role="status">本地草稿</span><button class="btn primary" id="submit" type="button">预览审核结果</button></div>
</div></header>
<main class="wrap">
  <section class="hero" aria-labelledby="pageTitle">
    <div><h1 id="pageTitle">提测审阅</h1></div>
    <div class="stats" aria-label="审核项状态"><div class="stat"><strong id="openCount">—</strong><span>待处理</span></div><div class="stat"><strong id="checkCount">—</strong><span>已确认</span></div><div class="stat"><strong id="editedCount">—</strong><span>已修改</span></div><div class="stat"><strong id="skipCount">—</strong><span>暂缓</span></div></div>
    <div class="hero-progress"><div class="progress-track" id="progress" role="progressbar" aria-label="审核处理进度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><div class="progress-fill" id="progressFill"></div></div><span id="progressText">—</span></div>
  </section>
  <details class="source" id="requestContext" hidden><summary>提测原文与资料</summary><p id="requestOriginal"></p><ul class="summary-list" id="requestReferences"></ul></details>
  <details class="source" id="previousDraft" hidden><summary>查看旧版草稿</summary><p>请按当前审核材料重新确认。下面的意见仅供对照。</p><ul class="summary-list" id="previousDraftItems"></ul><button class="btn" id="discardPreviousDraft" type="button">清除旧版草稿</button></details>
  <div class="workspace">
    <aside class="sidebar" aria-label="审核导航">
      <nav class="tabs"><button type="button" class="tab" data-view="questions">待回答</button><button type="button" class="tab" data-view="checks">关键断言</button><button type="button" class="tab" data-view="cases">全部用例</button></nav>
      <div class="sidebar-tools"><input class="search" id="search" type="search" placeholder="搜索编号或标题" aria-label="搜索编号或标题"><div class="filters" role="group" aria-label="状态筛选"><button class="filter" type="button" data-filter="all" aria-pressed="true">全部</button><button class="filter" type="button" data-filter="pending" aria-pressed="false">待处理</button><button class="filter" type="button" data-filter="confirmed" aria-pressed="false">已确认</button><button class="filter" type="button" data-filter="edited" aria-pressed="false">已修改</button><button class="filter" type="button" data-filter="deferred" aria-pressed="false">暂缓</button></div></div>
      <div class="list" id="list"></div>
    </aside>
    <section class="review" id="review" aria-label="当前审阅项"></section>
  </div>
</main>
<dialog id="preview"><div class="dialog-head"><h2>审核结果预览</h2><button class="btn" id="closePreview" type="button">关闭</button></div><div class="dialog-body" id="previewBody"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<script type="application/json" id="review-data">__REVIEW_DATA__</script>
<script>
const { cases, runId, revision, title, questions: questionItems, checks: checkItems, deferred: initialSkip, savedDecisions = {}, submitUrl, reviewState, requestContext } =
 JSON.parse(document.getElementById('review-data').textContent);
const storageKey = runId + (submitUrl ? ':review-live:' : ':review:') + revision;
const draftPointer = runId + ':review-live:latest-draft';
const previousDraftKey = runId + ':review-live:previous-draft';
document.title = title + ' · 提测审阅';
document.getElementById('pageTitle').textContent = title;
const caseItems = cases.map(item => ({...item,cases:[item.id]}));
const views = {questions:questionItems,checks:checkItems,cases:caseItems};
const byCase = Object.fromEntries(cases.map(item=>[item.id,item]));
let state = Object.fromEntries(Object.entries(initialSkip).map(([id,text])=>[id,{status:'deferred',text}]));
Object.assign(state, savedDecisions);
let savedState = {...state};
let currentReviewState = reviewState;
let browserStorage = true;
let restoredDraft = false;
try {
 if (submitUrl) {
  const lastKey = localStorage.getItem(draftPointer) || storageKey;
  const draft = JSON.parse(localStorage.getItem(lastKey) || 'null');
  if (draft && lastKey === storageKey && draft.reviewState === currentReviewState) {
   state = draft.state;
   restoredDraft = true;
  } else if (draft?.changes?.length) {
   localStorage.setItem(previousDraftKey, JSON.stringify(draft.changes));
   localStorage.removeItem(lastKey);
   localStorage.removeItem(draftPointer);
  }
 } else {
  Object.assign(state, JSON.parse(localStorage.getItem(storageKey) || '{}'));
 }
} catch { browserStorage = false; }
let view = 'questions', picked;
let editing = null;
let query = '';
let filter = 'all';
let submitting = false;
const $ = id => document.getElementById(id);
const esc = value => String(value ?? '').replace(/[&<>"']/g, mark => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[mark]));
if(requestContext){
 $('requestContext').hidden=false;
 $('requestOriginal').textContent=requestContext.original;
 $('requestReferences').innerHTML=requestContext.references.map(ref=>'<li>'+esc(ref)+'</li>').join('');
}
const status = item => state[item.id]?.status ?? item.status ?? (checkItems.includes(item) ? 'pending' : 'reference');
const label = (item,s=status(item)) => ({pending:checkItems.includes(item)?'待审核':'待回答',confirmed:'已确认',edited:'已修改',deferred:'本轮暂缓',reference:'用例原文'}[s]);
const badge = (item,s=status(item)) => '<span class="badge '+({pending:'todo',confirmed:'done',edited:'done'}[s]||'')+'">'+label(item,s)+'</span>';
const caseLabel = id => byCase[id]?.displayId ?? id;
const ids = item => item.cases.map(id=>'<button type="button" class="ticket" data-case="'+esc(id)+'">'+esc(caseLabel(id))+'</button>').join('');
const textOf = item => state[item.id]?.text ?? item.answer ?? item.checks?.join('\n') ?? item.expected ?? '';
function changed(id) {
 return submitUrl ? state[id]?.status !== savedState[id]?.status || state[id]?.text !== savedState[id]?.text : Boolean(state[id]);
}
function saved() {
 try {
  if (browserStorage && submitUrl) {
   const changes = [...questionItems, ...checkItems, ...caseItems].filter(item=>changed(item.id))
     .map(item=>`${item.title} · ${item.cases.map(caseLabel).join('、')}\n${textOf(item) || '已重置为待审核'}`);
   localStorage.setItem(storageKey, JSON.stringify({reviewState:currentReviewState, state, changes}));
   localStorage.setItem(draftPointer, storageKey);
  } else if (browserStorage) localStorage.setItem(storageKey, JSON.stringify(state));
 }
 catch { browserStorage = false; }
 const dirty=[...questionItems,...checkItems,...caseItems].some(item=>changed(item.id));
 $('saveStatus').dataset.state = dirty ? 'dirty' : 'saved';
 $('saveStatus').textContent = dirty ? (browserStorage ? '有未提交修改 · 草稿已保存' : '有未提交修改 · 当前会话草稿') : (submitUrl ? '已提交' : '本地草稿');
}
function showPreviousDraft() {
 if (!submitUrl || !browserStorage) return;
 try {
  const rows = JSON.parse(localStorage.getItem(previousDraftKey) || '[]');
  $('previousDraft').hidden = !rows.length;
  $('previousDraftItems').innerHTML = rows.map(row=>'<li>'+esc(row)+'</li>').join('');
 } catch { /* Leave the current review usable if browser storage is unavailable. */ }
}
$('discardPreviousDraft').onclick=()=>{
 try { localStorage.removeItem(previousDraftKey); } catch { /* Optional browser storage. */ }
 $('previousDraft').hidden=true;
};
function updateCounts() {
 const items=[...questionItems,...checkItems];
 const count=s=>items.filter(i=>status(i)===s).length;
 const pending=count('pending'), confirmed=count('confirmed'), edited=count('edited'), deferred=count('deferred');
 $('openCount').textContent=pending;
 $('checkCount').textContent=confirmed;
 $('editedCount').textContent=edited;
 $('skipCount').textContent=deferred;
 const done=items.length-pending;
 $('progress').setAttribute('aria-valuemax',items.length);
 $('progress').setAttribute('aria-valuenow',done);
 $('progressFill').style.width=(items.length?done/items.length*100:0)+'%';
 $('progressText').textContent=done+' / '+items.length+' 已处理';
}
function ordered() {
 const items = views[view];
 return view==='questions' ? [...items].sort((a,b)=>Number(status(b)==='pending')-Number(status(a)==='pending')) : items;
}
function visible() {
 const q=query.trim().toLowerCase();
 return ordered().filter(item=>{
  const itemStatus=view==='cases'&&deferredCases().has(item.id)?'deferred':status(item);
  return (filter==='all'||itemStatus===filter)&&[item.id,item.title,...item.cases,...item.cases.map(caseLabel)].join(' ').toLowerCase().includes(q);
 });
}
function showSource(item) {
 const sources=item.cases.map(id=>byCase[id]).filter(Boolean);
 return '<details class="source"><summary>查看用例依据'+(item.link?'和设计稿':'')+'</summary>'+
  (item.source?'<p>'+esc(item.source)+'</p>':'')+
  (item.link?'<p><a target="_blank" rel="noopener" href="'+esc(item.link)+'">打开参考资料 ↗</a></p>':'')+
  sources.map(c=>'<p><b>'+esc(caseLabel(c.id)+' · '+c.source)+'</b>'+esc(c.expected)+'</p>').join('')+'</details>';
}
function editor(item) {
 if(!editing || editing.id!==item.id) return '';
 const defer=editing.mode==='defer';
 const label=defer?'暂缓原因':view==='cases'?'请注明要修正的前置、步骤或预期':view==='questions'?'修改后的答复':item.expectations?'修改后的验法':'修改后的预期';
 const value=defer?'':view==='cases'?state[item.id]?.text ?? '':textOf(item);
 return '<form class="editor" id="editor"><label for="draft">'+label+'</label>'+
  '<textarea id="draft" required'+(!defer&&view==='checks'&&item.expectations?' aria-describedby="method-guide"':'')+'>'+esc(value)+'</textarea>'+
  (!defer&&view==='checks'&&item.expectations?'<p class="small muted" id="method-guide">写清操作对象、开始判定的页面信号和通过条件。</p>':'')+
  '<div class="actions"><button class="btn primary" type="submit">保存'+(defer?'暂缓':'修改')+'</button><button class="btn" data-action="cancel" type="button">取消</button></div></form>';
}
function actions(item) {
 const modify=view==='questions'&&!textOf(item)?'补充答复':view==='questions'?'修改答复':item.expectations?'修改验法':'修改预期';
 return '<div class="actions">'+(view==='checks'&&status(item)==='pending'?'<button class="btn primary" data-action="confirm" type="button">'+(item.expectations?'确认验法':'确认预期')+'</button>':'')+
  (view==='questions'&&status(item)==='pending'&&!textOf(item)?'':'<button class="btn" data-action="edit" type="button">'+modify+'</button>')+
  '<button class="btn" data-action="defer" type="button">本轮暂缓</button>'+
  (state[item.id]?'<button class="btn flat" data-action="reset" type="button">恢复初始记录</button>':'')+'</div>';
}
function render() {
 updateCounts();
 document.querySelectorAll('[data-view]').forEach(btn=>btn.setAttribute('aria-current',String(btn.dataset.view===view)));
 const items=visible();
 if(!items.some(item=>item.id===picked)) picked=items[0]?.id;
 $('list').innerHTML=items.length?items.map(item=>'<button type="button" class="entry" data-item="'+esc(item.id)+'" aria-current="'+(item.id===picked)+'"><span class="entry-meta">'+esc(caseLabel(item.id))+badge(item)+'</span><strong>'+esc(item.title)+'</strong></button>').join(''):'<p class="empty">暂无条目</p>';
 const current=items.find(item=>item.id===picked);
 if(!current){ $('review').innerHTML='<div class="body muted">'+(query?'试试按用例编号或关键词搜索。':filter!=='all'?'当前筛选下没有审核项。':'这一栏目前没有内容，可切换查看其他栏目。')+'</div>';return; }
 const kind=view==='questions'?'需要补充的信息':view==='checks'?'需要核对的预期':'用例原文';
 const index=items.indexOf(current);
 const header='<div class="review-head"><div class="eyebrow">'+esc(caseLabel(current.id))+' · '+kind+' '+badge(current)+'</div><h2>'+esc(current.title)+'</h2>'+(current.description?'<p class="muted">'+esc(current.description)+'</p>':'')+'</div>';
 const nav='<div class="nav-footer"><button type="button" class="btn" data-action="prev" '+(index===0?'disabled':'')+'>‹ 上一项</button><span class="nav-progress" aria-label="当前第 '+(index+1)+' 项，共 '+items.length+' 项">'+(index+1)+' / '+items.length+'</span><button type="button" class="btn" data-action="next" '+(index===items.length-1?'disabled':'')+'>下一项 ›</button></div>';
 if(view==='cases'){
  const sections=[['前置条件',current.pre],['操作步骤',current.steps],['原始预期',current.expected]];
  const linked=[...questionItems,...checkItems].filter(item=>item.cases.includes(current.id)&&status(item)!=='pending');
  const notes=linked.length?'<section class="case-notes"><h3>关联的审核结果</h3><ul class="checks">'+linked.map(item=>'<li><strong>'+esc(item.id+' · '+label(item))+'</strong><br>'+esc(textOf(item))+'</li>').join('')+'</ul></section>':'';
  const skipped=deferredCases().has(current.id);
  const correction=state[current.id]?.status==='edited'?'<p class="box block">'+esc(textOf(current))+'</p>':'';
  const correctButton=skipped?'':'<div class="actions"><button class="btn" type="button" data-action="edit">补充纠正</button>'+(correction?'<button class="btn flat" type="button" data-action="reset">撤回纠正</button>':'')+'</div>';
  $('review').innerHTML=header+'<div class="body"><p class="small muted">'+esc(current.source)+'</p>'+(skipped?'<p class="box block">'+esc(initialSkip[current.id]??'本轮暂缓，原因见关联的审核结果。')+'</p>':'')+notes+
  sections.map(([name,body])=>'<div class="case-section"><h3>'+name+'</h3>'+esc(body)+'</div>').join('')+correctButton+correction+editor(current)+'</div>'+nav;
  if(editing?.id===current.id) $('draft')?.focus();
  return;
 }
 const content = status(current)==='deferred'
  ? '<h3>暂缓原因</h3><div class="box">'+esc(textOf(current))+'</div>'
  : view==='questions'
    ? (status(current)==='pending'&&!textOf(current)?'<div class="inline-answer"><label for="inlineAnswer">你的答复</label><textarea id="inlineAnswer" placeholder="填写能帮助 Agent 继续的信息"></textarea><p>输入后自动保存草稿，提交审核后生效。</p></div>':'<h3>当前答复</h3><div class="box answer">'+esc(textOf(current))+'</div>')
    : '<h3>'+(current.expectations?'验法与通过条件':'Agent 将检查')+'</h3><ul class="checks">'+textOf(current).split('\n').filter(Boolean).map(line=>'<li>'+esc(line)+'</li>').join('')+'</ul>';
 const comparison=current.expectations?'<div class="review-comparison"><section class="original"><h3>原始预期</h3><ul class="checks">'+Object.entries(current.expectations).map(([id, line])=>'<li><strong>'+esc(caseLabel(id))+'</strong> '+esc(line)+'</li>').join('')+'</ul></section><section>'+content+'</section></div>':content;
 $('review').innerHTML=header+'<div class="body">'+comparison+'<div class="impact small muted">关联用例 '+ids(current)+'</div>'+actions(current)+editor(current)+showSource(current)+'</div>'+nav;
 if(editing?.id===current.id) $('draft')?.focus();
}
function deferredCases() {
 const skipped=new Set(Object.keys(initialSkip));
 for(const item of [...questionItems,...checkItems]) if(status(item)==='deferred') item.cases.forEach(id=>skipped.add(id));
 return skipped;
}
function switchView(next, itemId) {view=next;query='';filter='all';editing=null;$('search').value='';document.querySelectorAll('[data-filter]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn.dataset.filter==='all')));picked=itemId??ordered()[0]?.id;render();}
document.querySelector('.tabs').addEventListener('click',event=>{const tab=event.target.closest('[data-view]');if(tab)switchView(tab.dataset.view);});
document.querySelector('.tabs').addEventListener('keydown',event=>{
 if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
 const tabs=[...document.querySelectorAll('.tabs [data-view]')],index=tabs.indexOf(event.target);
 if(index<0)return;
 event.preventDefault();
 const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
 switchView(tabs[next].dataset.view);tabs[next].focus();
});
$('search').addEventListener('input',event=>{query=event.target.value;editing=null;render();});
document.querySelector('.filters').addEventListener('click',event=>{
 const button=event.target.closest('[data-filter]');if(!button)return;
 filter=button.dataset.filter;editing=null;
 document.querySelectorAll('[data-filter]').forEach(btn=>btn.setAttribute('aria-pressed',String(btn===button)));
 render();
});
$('list').addEventListener('click',event=>{const button=event.target.closest('[data-item]');if(button){picked=button.dataset.item;editing=null;render();}});
$('review').addEventListener('input',event=>{
 if(event.target.id!=='inlineAnswer')return;
 const text=event.target.value.trim();
 if(text) state[picked]={status:'edited',text}; else delete state[picked];
 saved();updateCounts();
});
$('review').addEventListener('click', event=>{
 const related=event.target.closest('[data-case]');
 if(related){switchView('cases',related.dataset.case);return;}
 const button=event.target.closest('[data-action]');
 if(!button) return;
 const action=button.dataset.action, items=visible(), index=items.findIndex(i=>i.id===picked), item=items[index];
 if(action==='prev'||action==='next'){picked=items[index+(action==='prev'?-1:1)]?.id;editing=null;}
 if(action==='edit'||action==='defer') editing={id:picked,mode:action};
 if(action==='cancel') editing=null;
 if(action==='confirm'){state[picked]={status:'confirmed',text:textOf(item)};editing=null;saved();}
 if(action==='reset'){delete state[picked];editing=null;saved();}
 render();
 if(action==='prev'||action==='next'){
  const target=$('review').querySelector('[data-action="'+action+'"]:not(:disabled)') || $('review').querySelector('[data-action="'+(action==='prev'?'next':'prev')+'"]:not(:disabled)');
  target?.focus();
 }
 if(action==='confirm'){toast('已确认验法');$('review').querySelector('[data-action="edit"]')?.focus();}
});
$('review').addEventListener('submit',event=>{
 if(event.target.id!=='editor')return;
 event.preventDefault();
 const input=$('draft'),text=input.value.trim();
 if(!text){input.setCustomValidity('请填写内容');input.reportValidity();input.addEventListener('input',()=>input.setCustomValidity(''),{once:true});return;}
 state[picked]={status:editing.mode==='defer'?'deferred':'edited',text};
 editing=null;saved();render();toast('已更新审核意见');
});
let toastTimer;
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,2600);}
function exportData() {
 const corrections=caseItems.filter(item=>state[item.id]?.status==='edited');
 const decisions=[...questionItems.filter(i=>status(i)!=='pending'),...checkItems.filter(i=>status(i)!=='pending'),...corrections].map(item=>({
  review_id:item.id,case_ids:item.cases,
  status:status(item),value:textOf(item),changed_here:changed(item.id)
 }));
 return {run_id:runId, revision, review_version:1, decisions, pending:[...questionItems,...checkItems].filter(i=>status(i)==='pending').map(i=>({review_id:i.id,case_ids:i.cases})),
 deferred_cases:[...deferredCases()].map(id=>({id,display_id:caseLabel(id),reason:initialSkip[id] ?? [...questionItems,...checkItems].filter(i=>status(i)==='deferred'&&i.cases.includes(id)).map(textOf).join('；')}))};
}
async function sendReview(data) {
 if (submitting) return;
 submitting = true;
 const button = $('sendReview');
 button.disabled = true;
 $('closePreview').disabled = true;
 $('submitStatus').textContent = '正在保存审核意见…';
 let needsRefresh = false;
 try {
  const response = await fetch(submitUrl, {
   method:'POST', headers:{'Content-Type':'application/json'},
   body:JSON.stringify({...data,review_state:currentReviewState}),
  });
  const receipt = await response.json();
  if (!response.ok || !receipt.ok) {
   if (receipt.code === 'review_conflict') {
    needsRefresh = true;
    $('refreshReview').hidden = false;
   }
   $('submitStatus').textContent = receipt.message || '暂时无法提交，请重试。';
   return;
  }
  const draft = localStorageDraft();
  try {
   if (draft?.reviewState === currentReviewState && JSON.stringify(draft.state) === JSON.stringify(state)) {
    localStorage.removeItem(storageKey);
    if (localStorage.getItem(draftPointer) === storageKey) localStorage.removeItem(draftPointer);
   }
  } catch { /* Server persistence has already succeeded. */ }
  currentReviewState = receipt.review_state;
  savedState = {...state};
  $('saveStatus').dataset.state = 'saved';
  $('saveStatus').textContent = '已保存 '+receipt.decisions.length+' 项';
  const listItems = rows => rows.length ? '<ul class="summary-list">'+rows.map(row=>
    '<li>'+esc(row.title+' · '+row.cases.map(caseLabel).join('、'))+'</li>').join('')+'</ul>' : '<p class="muted">无</p>';
  $('previewBody').innerHTML = '<p role="status"><strong>审核意见已保存</strong> · '+receipt.decisions.length+
   ' 项已保存，'+receipt.pending.length+' 项待处理。</p><h3>已保存</h3>'+listItems(receipt.decisions)+
   '<h3>仍待处理</h3>'+listItems(receipt.pending);
  render();
 } catch {
  $('submitStatus').textContent = '审核服务暂时无法连接或未返回回执。草稿仍在此页面，请重试。';
 } finally {
  submitting = false;
  button.disabled = needsRefresh;
  $('closePreview').disabled = false;
 }
}
function localStorageDraft() {
 try { return JSON.parse(localStorage.getItem(storageKey) || 'null'); } catch { return null; }
}
$('submit').addEventListener('click',()=>{
 const data=exportData(), changes=data.decisions.filter(i=>i.changed_here);
 const skipped=data.deferred_cases.map(i=>'<li>'+esc(i.display_id+' · '+i.reason)+'</li>').join('');
 const list=changes.map(i=>'<li>'+esc(i.review_id+' · '+i.case_ids.join('、')+'\n'+i.value)+'</li>').join('');
 $('previewBody').innerHTML='<p class="muted">仍待审核 '+data.pending.length+' 项。'+(submitUrl?'可以先提交已确认的意见。':'可下载本轮反馈，待审核项也会保留。')+'</p>'+
 '<h3>本次修改或确认</h3>'+(list?'<ul class="summary-list">'+list+'</ul>':'<p class="small muted">当前沿用已有记录。</p>')+
 '<h3>本轮暂缓</h3><ul class="summary-list">'+skipped+'</ul>'+
 (submitUrl ? '<p id="submitStatus" role="status"></p><div class="actions"><button class="btn primary" id="sendReview" type="button">提交审核</button><button class="btn" id="refreshReview" type="button" hidden>刷新审核材料</button></div>' :
  '<details class="source"><summary>查看结构化结果</summary><textarea class="export-text" id="exportText" readonly aria-label="审核结果 JSON"></textarea></details>'+
  '<div class="actions"><button type="button" class="btn primary" id="download">下载审核结果</button></div>');
 if (submitUrl) {
  $('sendReview').onclick=()=>sendReview(data);
  $('refreshReview').onclick=()=>location.reload();
 } else {
 const json=JSON.stringify(data,null,2);
 $('exportText').value=json;
 $('download').onclick=()=>{
  const url=URL.createObjectURL(new Blob([json+'\n'],{type:'application/json'}));
  const link=document.createElement('a');link.href=url;link.download=runId+'-review.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 };
 }
 $('preview').showModal();
});
$('closePreview').addEventListener('click',()=>$('preview').close());
$('preview').addEventListener('cancel',event=>{if (submitting) event.preventDefault();});
if (restoredDraft) {
 const dirty=[...questionItems,...checkItems,...caseItems].some(item=>changed(item.id));
 $('saveStatus').dataset.state=dirty?'dirty':'saved';
 $('saveStatus').textContent=dirty?'有未提交修改 · 草稿已保存':'已提交';
} else if (submitUrl && Object.keys(savedDecisions).length) { $('saveStatus').dataset.state='saved';$('saveStatus').textContent = '已保存 '+Object.keys(savedDecisions).length+' 项'; }
showPreviousDraft();
if (!questionItems.some(item => status(item) === 'pending')) view = checkItems.length ? 'checks' : questionItems.length ? 'questions' : 'cases';
render();
</script>
</body>
</html>
