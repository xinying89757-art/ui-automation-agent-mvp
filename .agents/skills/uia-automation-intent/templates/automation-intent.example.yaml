    - {id: CAP-02, capability: open_target_product_editor, semantic_name: "打开目标产品编辑页", category: NAVIGATION, required: true, step_refs: [S1], preferred_asset_types: [business_action, page_object], ui_knowledge_refs: [page-prod, runtime-ajax-pagination-and-sort]}
    - {id: CAP-03, capability: configure_product_custom_url, semantic_name: "配置并保存产品自定义URL", category: BUSINESS_ACTION, required: true, step_refs: [S2], preferred_asset_types: [business_action, page_object], ui_knowledge_refs: [page-prod, component-product-url-editor]}
    - {id: CAP-04, capability: open_product_page_settings, semantic_name: "打开产品页面设置基础设置", category: NAVIGATION, required: true, step_refs: [S3], preferred_asset_types: [business_action, page_object], ui_knowledge_refs: [page-prod, component-page-settings-panel, component-popup-layer, runtime-popup-mount-and-obscuration]}
