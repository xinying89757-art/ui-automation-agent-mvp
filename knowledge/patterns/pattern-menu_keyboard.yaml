id: pattern.MENU_KEYBOARD
kind: pattern
description: Try the normal pointer click after scrolling/collapsing covers first. Only
  if the click still fails, keep focus in the editor or trigger, type the visible label
  to filter, then press Enter; use ArrowDown then Enter as a bounded fallback.
strategy: menu_keyboard
