      required_capability_refs: [CAP-03]
      runtime_unknown_refs: [RU-02]
      source_refs: [{type: TEST_CASE, ref: "TC_PD_001"}]
    - id: S3
      intent: "打开目标产品页面设置的基础设置"
      context:
        page: {semantic_name: "后台产品管理页", knowledge_ref: page-prod}
        region: {semantic_name: "页面设置", knowledge_ref: null}
      anchor:
        primary: {semantic_name: "页面设置"}
        secondary: []
      target:
        semantic_name: "基础设置页签"
        expected_type: TAB_OR_PANEL
        knowledge_ref: null
      action: {type: OPEN, value_ref: null}
      expected_transition:
