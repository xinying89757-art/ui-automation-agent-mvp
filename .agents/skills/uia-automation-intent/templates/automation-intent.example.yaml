    - {id: CAP-06, capability: open_product_custom_url_in_clean_browser, semantic_name: "在无痕未登录状态打开受保护产品URL", category: ENVIRONMENT, required: true, step_refs: [S5], preferred_asset_types: [environment_helper, business_action], ui_knowledge_refs: [page-prod, runtime-password-page-presentation]}
    - {id: CAP-07, capability: assert_password_gate_state, semantic_name: "验证密码保护页状态", category: ASSERTION, required: true, step_refs: [S7], preferred_asset_types: [assertion, page_object], ui_knowledge_refs: [page-prod, component-password-gate]}
    - {id: CAP-08, capability: complete_frontend_password_verification, semantic_name: "完成前台密码验证", category: AUTH, required: true, step_refs: [S6], preferred_asset_types: [auth, business_action], ui_knowledge_refs: [component-password-gate, runtime-password-verification-transition]}
    - {id: CAP-09, capability: assert_product_detail_content_visible, semantic_name: "验证产品详情内容可见", category: ASSERTION, required: true, step_refs: [S8], preferred_asset_types: [assertion, page_object], ui_knowledge_refs: [page-prod]}
  assertions:
