        region: {semantic_name: "产品列表与工具区", knowledge_ref: prod-management}
      anchor:
        primary: {semantic_name: "目标产品", value_ref: "${target_product}"}
        secondary: []
      target:
        semantic_name: "产品管理入口"
        expected_type: NAVIGATION_ENTRY
        knowledge_ref: component-module-navigation
      action: {type: OPEN, value_ref: null}
      expected_transition:
        - {type: PAGE_OR_REGION_VISIBLE, semantic_target: "目标产品编辑页"}
      required_capability_refs: [CAP-01, CAP-02]
      runtime_unknown_refs: [RU-01]
      source_refs: [{type: TEST_CASE, ref: "TC_PD_001"}]
    - id: S2
      intent: "配置目标产品的带目录自定义URL并保存"
      context:
        page: {semantic_name: "后台产品管理页", knowledge_ref: page-prod}
        region: {semantic_name: "产品URL设置", knowledge_ref: null}
      anchor:
