      target: {semantic_name: "密码输入页", knowledge_ref: component-password-gate}
      expected: {semantic_name: "未验证时密码输入页可见"}
      required_capability_ref: CAP-07
      required: true
      source_refs: [{type: TEST_CASE, ref: "TC_PD_001"}]
    - id: A-02
      type: VISIBILITY
      target: {semantic_name: "产品内容", knowledge_ref: null}
      expected: {value: false, semantic_name: "未验证时产品内容不可见"}
      required_capability_ref: CAP-07
      required: true
      source_refs: [{type: TEST_CASE, ref: "TC_PD_001"}]
    - id: A-03
